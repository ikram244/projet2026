<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant KOFERT · Plateforme PAP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f4f1;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ===== SIDEBAR (moderne, sombre avec dégradé) ===== */
    .sidebar-chat {
      width: 280px;
      background: linear-gradient(180deg, #0b2a1c 0%, #0f3a28 100%);
      color: #e2efe8;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      overflow: hidden;
      box-shadow: 4px 0 20px rgba(0, 20, 10, 0.2);
      position: relative;
      z-index: 10;
      transition: transform 0.25s ease;
    }
    .sidebar-chat .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 24px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .sidebar-chat .brand .badge {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #3fae5f, #1a6b3a);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(26, 107, 58, 0.35);
    }
    .sidebar-chat .brand div {
      line-height: 1.3;
    }
    .sidebar-chat .brand div strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #f0faf5;
      letter-spacing: -0.2px;
    }
    .sidebar-chat .brand div small {
      font-size: 10.5px;
      opacity: 0.6;
      font-weight: 400;
    }

    .sidebar-chat .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 18px 10px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: rgba(63, 174, 95, 0.18);
      color: #c6efe0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .sidebar-chat .new-chat-btn:hover {
      background: rgba(63, 174, 95, 0.3);
      color: #fff;
      transform: translateY(-1px);
    }
    .sidebar-chat .new-chat-btn .plus {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: #3fae5f;
      color: #0b2a1c;
      font-weight: 800;
      font-size: 14px;
    }

    .history-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.3);
      padding: 14px 24px 6px;
      font-weight: 700;
    }

    .history-list {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 4px 12px 12px;
    }
    .history-list::-webkit-scrollbar {
      width: 3px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(63, 174, 95, 0.3);
      border-radius: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #c6e0d4;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }
    .history-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    .history-item.active {
      background: rgba(63, 174, 95, 0.22);
      color: #fff;
    }
    .history-item .title-text {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item .del-btn {
      flex: 0 0 auto;
      opacity: 0;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #7fa392;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .history-item:hover .del-btn {
      opacity: 0.7;
    }
    .history-item .del-btn:hover {
      background: rgba(214, 69, 69, 0.25);
      color: #ff9d9d;
      opacity: 1;
    }

    .sidebar-chat .footer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 24px 6px;
      font-size: 10.5px;
      opacity: 0.4;
      text-align: center;
    }
    .sidebar-chat .logout-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px 18px;
      font-size: 13px;
      color: #b0ccc0;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .sidebar-chat .logout-link:hover {
      color: #fff;
    }

    /* ===== MAIN CHAT (full height) ===== */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #ffffff;
      min-width: 0;
    }

    /* ===== HEADER ===== */
    .chat-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid #e8edeb;
      background: #fafcfb;
    }
    .chat-header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header .brand h1 {
      font-size: 15px;
      font-weight: 700;
      color: #0b2a1c;
      letter-spacing: -0.2px;
    }
    .chat-header .brand .sub {
      font-size: 11px;
      color: #7f9b8e;
      font-weight: 400;
      margin-left: 6px;
    }
    .chat-header .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header .toolbar select {
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid #d9e3de;
      background: white;
      font-size: 12px;
      color: #1a3a2a;
      cursor: pointer;
      outline: none;
    }
    .chat-header .toolbar select:focus {
      border-color: #3fae5f;
    }

    /* ===== SCROLLABLE MESSAGES ===== */
    #chat-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      background: #f8fbfa;
      padding: 16px 20px 8px;
      scroll-behavior: smooth;
    }
    #chat-scroll::-webkit-scrollbar {
      width: 6px;
    }
    #chat-scroll::-webkit-scrollbar-thumb {
      background: #c8d9d0;
      border-radius: 10px;
    }
    #chat-scroll::-webkit-scrollbar-thumb:hover {
      background: #a9bfb4;
    }

    #chat {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ===== MESSAGE BUBBLES ===== */
    .turn {
      display: flex;
      gap: 14px;
      padding: 12px 0;
      align-items: flex-start;
    }
    .turn + .turn {
      border-top: 1px solid rgba(0, 0, 0, 0.03);
    }

    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .turn.user .avatar {
      background: linear-gradient(135deg, #2d3e3a, #1a2b26);
    }
    .turn.bot .avatar {
      background: linear-gradient(135deg, #1a6b3a, #3fae5f);
    }

    .bubble {
      flex: 1;
      min-width: 0;
    }
    .bubble .name {
      font-size: 12px;
      font-weight: 600;
      color: #7f9b8e;
      margin-bottom: 3px;
    }
    .bubble .content {
      font-size: 14.5px;
      line-height: 1.6;
      color: #1c2b26;
      word-break: break-word;
    }
    .bubble .content p {
      margin: 0 0 10px;
    }
    .bubble .content p:last-child {
      margin-bottom: 0;
    }
    .bubble .content ul,
    .bubble .content ol {
      margin: 6px 0 10px;
      padding-left: 22px;
    }
    .bubble .content li {
      margin-bottom: 4px;
    }
    .bubble .content strong {
      color: #0b2a1c;
      font-weight: 700;
    }
    .bubble .content code {
      background: #eaf0ed;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #0f3a28;
    }
    .bubble .content table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
      font-size: 13px;
    }
    .bubble .content th,
    .bubble .content td {
      border: 1px solid #d9e3de;
      padding: 6px 10px;
      text-align: left;
    }
    .bubble .content th {
      background: #eaf3ef;
      font-weight: 700;
      color: #0b2a1c;
    }

    /* RTL support */
    .turn[dir="rtl"] .content {
      text-align: right;
    }
    .turn[dir="rtl"] .content ul,
    .turn[dir="rtl"] .content ol {
      padding-left: 0;
      padding-right: 22px;
    }

    .sources {
      font-size: 11px;
      color: #8aa69a;
      margin-top: 6px;
      background: #eef4f1;
      padding: 4px 12px;
      border-radius: 16px;
      display: inline-block;
    }

    .speak-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: #eaf3ef;
      color: #1a6b3a;
      cursor: pointer;
      font-size: 13px;
      margin-top: 6px;
      transition: all 0.2s ease;
    }
    .speak-btn:hover {
      background: #3fae5f;
      color: #fff;
      transform: scale(1.05);
    }

    /* ===== EMPTY STATE ===== */
    .empty-hint {
      max-width: 480px;
      margin: 60px auto;
      text-align: center;
      color: #6f8b7e;
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .empty-hint .icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #1a6b3a, #3fae5f);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(26, 107, 58, 0.2);
    }
    .empty-hint h2 {
      font-size: 18px;
      color: #0b2a1c;
      margin: 0 0 6px;
      font-weight: 700;
    }
    .empty-hint p {
      font-size: 13.5px;
      line-height: 1.6;
      margin: 0;
    }

    /* ===== COMPOSER (fixe en bas) ===== */
    .composer-wrap {
      flex: 0 0 auto;
      border-top: 1px solid #e8edeb;
      padding: 12px 20px 16px;
      background: #fafcfb;
    }
    .composer {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #ffffff;
      border: 1.5px solid #d9e3de;
      border-radius: 30px;
      padding: 6px 6px 6px 18px;
      box-shadow: 0 4px 16px rgba(0, 20, 10, 0.04);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .composer:focus-within {
      border-color: #3fae5f;
      box-shadow: 0 6px 24px rgba(63, 174, 95, 0.12);
    }
    #question {
      flex: 1 1 auto;
      border: none;
      outline: none;
      resize: none;
      font-size: 14.5px;
      line-height: 1.5;
      padding: 8px 0;
      max-height: 150px;
      font-family: inherit;
      color: #1c2b26;
      background: transparent;
    }
    #question::placeholder {
      color: #a9bfb4;
    }

    .composer button {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .composer .mic-btn {
      background: #eaf3ef;
      color: #1a6b3a;
    }
    .composer .mic-btn:hover {
      background: #d0e6dc;
    }
    .composer .mic-btn.recording {
      background: #d64545;
      color: #fff;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    .composer .send {
      background: #d9e3de;
      color: #8aa69a;
    }
    .composer .send:not(:disabled) {
      background: linear-gradient(135deg, #1a6b3a, #3fae5f);
      color: #fff;
      box-shadow: 0 4px 14px rgba(26, 107, 58, 0.25);
    }
    .composer .send:not(:disabled):hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }
    .composer .send:disabled {
      cursor: not-allowed;
    }

    #status {
      max-width: 820px;
      margin: 6px auto 0;
      font-size: 11.5px;
      color: #8aa69a;
      text-align: center;
      min-height: 18px;
      transition: opacity 0.2s;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar-chat {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        width: 280px;
        z-index: 20;
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease;
      }
      .sidebar-chat.open {
        transform: translateX(0);
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 15;
      }
      .sidebar-overlay.show {
        display: block;
      }
      .chat-header .brand h1 {
        font-size: 13px;
      }
      .chat-header .brand .sub {
        display: none;
      }
      .composer {
        padding: 6px 6px 6px 14px;
      }
      #question {
        font-size: 13.5px;
      }
    }

    /* Hamburger menu for mobile */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 22px;
      color: #0b2a1c;
      cursor: pointer;
      padding: 4px 8px;
    }
    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- ===== OVERLAY MOBILE ===== -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar-chat" id="sidebarChat">
    <div class="brand">
      <div class="badge">P</div>
      <div>
        <strong>Plateforme PAP</strong>
        <small>OCP Group — Atelier</small>
      </div>
    </div>

    <button class="new-chat-btn" id="new-chat-btn">
      <span class="plus">+</span> Nouvelle conversation
    </button>

    <div class="history-label">Historique</div>
    <div class="history-list" id="history-list"></div>

    <div class="footer">Assistant échelons J / K / L</div>
    <a class="logout-link" href="/logout">↩ Se déconnecter</a>
  </div>

  <!-- ===== MAIN CHAT ===== -->
  <div class="main-chat">

    <!-- Header -->
    <header class="chat-header">
      <div class="brand">
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
        <div>
          <h1>Assistant KOFERT <span class="sub">· IA technique</span></h1>
        </div>
      </div>
      <div class="toolbar">
        <select id="lang-select">
          <option value="fr-FR">Français</option>
          <option value="ar-MA">Arabe (Maroc)</option>
          <option value="ar-SA">Arabe standard</option>
        </select>
      </div>
    </header>

    <input type="text" id="api-url" value="/api/chat" style="display:none;">

    <!-- Messages -->
    <div id="chat-scroll">
      <div id="chat"></div>
    </div>

    <!-- Composer -->
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="question" rows="1" placeholder="Posez votre question…"></textarea>
        <button class="mic-btn" id="mic-btn" title="Parler">🎤</button>
        <button class="send" id="send-btn" title="Envoyer">➤</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    // ===== MÊME LOGIQUE JAVASCRIPT QUE L'ORIGINAL, CONSERVÉE =====
    // (On reprend exactement le script de l'ancien chat.html pour préserver
    //  l'historique, la synthèse vocale, la gestion des conversations, etc.)

    const USER_ID = {{ session.get('user_id', 0) }};
    if (USER_ID === 0) window.location.href = '/';

    const CONV_KEY = `kofert_conversations_user_${USER_ID}`;
    const ACTIVE_KEY = `kofert_active_conv_user_${USER_ID}`;

    let conversations = JSON.parse(localStorage.getItem(CONV_KEY) || "[]");
    let activeId = localStorage.getItem(ACTIVE_KEY) || null;

    function saveConversations() {
      localStorage.setItem(CONV_KEY, JSON.stringify(conversations));
    }
    function saveActiveId() {
      localStorage.setItem(ACTIVE_KEY, activeId || "");
    }

    function getActiveConv() {
      return conversations.find(c => c.id === activeId) || null;
    }

    function makeTitleFromText(text) {
      const clean = text.trim().replace(/\s+/g, " ");
      return clean.length > 34 ? clean.slice(0, 34) + "…" : clean;
    }

    function createConversation() {
      const conv = { id: "c" + Date.now(), db_id: null, title: "Nouvelle conversation", messages: [] };
      conversations.unshift(conv);
      activeId = conv.id;
      saveConversations();
      saveActiveId();
      renderHistoryList();
      renderChat();
    }

    function switchConversation(id) {
      activeId = id;
      saveActiveId();
      renderHistoryList();
      renderChat();
    }

    async function deleteConversation(id, evt) {
      evt.stopPropagation();
      if (!confirm("Supprimer cette conversation ?")) return;
      const conv = conversations.find(c => c.id === id);
      if (conv && conv.db_id) {
        try {
          await fetch(`/api/conversations/${conv.db_id}`, { method: "DELETE" });
        } catch (e) { console.error(e); }
      }
      conversations = conversations.filter(c => c.id !== id);
      if (activeId === id) {
        activeId = conversations.length ? conversations[0].id : null;
        if (!activeId) createConversation();
      }
      saveConversations();
      saveActiveId();
      renderHistoryList();
      renderChat();
    }

    function renderHistoryList() {
      const list = document.getElementById("history-list");
      if (!list) return;
      list.innerHTML = "";
      for (const conv of conversations) {
        const item = document.createElement("div");
        item.className = "history-item" + (conv.id === activeId ? " active" : "");
        item.addEventListener("click", () => switchConversation(conv.id));
        const titleEl = document.createElement("span");
        titleEl.className = "title-text";
        titleEl.textContent = conv.title;
        item.appendChild(titleEl);
        const delBtn = document.createElement("button");
        delBtn.className = "del-btn";
        delBtn.innerHTML = "✕";
        delBtn.title = "Supprimer";
        delBtn.addEventListener("click", (e) => deleteConversation(conv.id, e));
        item.appendChild(delBtn);
        list.appendChild(item);
      }
    }

    function isArabic(text) {
      return /[\u0600-\u06FF]/.test(text);
    }

    let voicesCache = [];

    function loadVoices() {
      voicesCache = window.speechSynthesis.getVoices();
    }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickBestVoice(lang) {
      if (!voicesCache.length) return null;
      let match = voicesCache.find(v => v.lang === lang);
      if (match) return match;
      const prefix = lang.split("-")[0];
      match = voicesCache.find(v => v.lang.startsWith(prefix));
      return match || null;
    }

    function speak(text, lang) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      utter.pitch = 1;
      const voice = pickBestVoice(lang);
      if (voice) utter.voice = voice;
      window.speechSynthesis.speak(utter);
    }

    function showEmptyHint() {
      const chat = document.getElementById("chat");
      chat.innerHTML = `
        <div class="empty-hint">
          <div class="icon">💬</div>
          <h2>Comment puis-je vous aider ?</h2>
          <p>Posez une question sur les règles opérationnelles, les plages normales des paramètres ou le fonctionnement des échelons J/K/L.</p>
        </div>`;
    }

    function buildMessageEl(role, text, sources) {
      const div = document.createElement("div");
      div.className = "turn " + role;
      const arabic = isArabic(text);
      if (arabic) div.setAttribute("dir", "rtl");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "V" : "AI";
      div.appendChild(avatar);

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = role === "user" ? "Vous" : "Assistant KOFERT";
      bubble.appendChild(name);

      const content = document.createElement("div");
      content.className = "content";
      if (role === "bot") {
        content.innerHTML = marked.parse(text);
      } else {
        content.textContent = text;
      }
      bubble.appendChild(content);

      if (sources && sources.length) {
        const s = document.createElement("div");
        s.className = "sources";
        s.textContent = "Sources : " + sources.map(s => "slide " + s.slide + (s.section ? " (" + s.section + ")" : "")).join(", ");
        bubble.appendChild(s);
      }

      if (role === "bot") {
        const btn = document.createElement("button");
        btn.className = "speak-btn";
        btn.title = "Écouter";
        btn.innerHTML = "🔊";
        btn.addEventListener("click", () => speak(text, arabic ? "ar-MA" : "fr-FR"));
        bubble.appendChild(btn);
      }

      div.appendChild(bubble);
      return div;
    }

    function renderChat() {
      const chat = document.getElementById("chat");
      const chatScroll = document.getElementById("chat-scroll");
      chat.innerHTML = "";
      const conv = getActiveConv();
      if (!conv || !conv.messages.length) {
        showEmptyHint();
        return;
      }
      for (const m of conv.messages) {
        chat.appendChild(buildMessageEl(m.role, m.content, m.sources));
      }
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function addMessage(role, text, sources) {
      const chat = document.getElementById("chat");
      const chatScroll = document.getElementById("chat-scroll");
      const emptyHint = chat.querySelector(".empty-hint");
      if (emptyHint) chat.innerHTML = "";

      chat.appendChild(buildMessageEl(role, text, sources));
      chatScroll.scrollTop = chatScroll.scrollHeight;

      const conv = getActiveConv();
      conv.messages.push({ role, content: text, sources: sources || [] });
      if (role === "user" && conv.messages.filter(m => m.role === "user").length === 1) {
        conv.title = makeTitleFromText(text);
      }
      saveConversations();
      renderHistoryList();
    }

    // ===== INIT =====
    if (!conversations.length) {
      createConversation();
    } else {
      if (!activeId || !getActiveConv()) {
        activeId = conversations[0].id;
        saveActiveId();
      }
      renderHistoryList();
      renderChat();
    }

    document.getElementById("new-chat-btn").addEventListener("click", createConversation);

    // Menu toggle mobile
    document.getElementById("menuToggle").addEventListener("click", () => {
      document.getElementById("sidebarChat").classList.toggle("open");
      document.getElementById("sidebarOverlay").classList.toggle("show");
    });
    document.getElementById("sidebarOverlay").addEventListener("click", () => {
      document.getElementById("sidebarChat").classList.remove("open");
      document.getElementById("sidebarOverlay").classList.remove("show");
    });

    const questionEl = document.getElementById("question");
    questionEl.addEventListener("input", () => {
      questionEl.style.height = "auto";
      questionEl.style.height = Math.min(questionEl.scrollHeight, 150) + "px";
    });

    async function send() {
      const input = document.getElementById("question");
      const question = input.value.trim();
      if (!question) return;

      const url = document.getElementById("api-url").value;
      const btn = document.getElementById("send-btn");
      const statusEl = document.getElementById("status");

      const convBeforeSend = getActiveConv();
      const apiHistory = convBeforeSend.messages.map(h => ({ role: h.role === "user" ? "user" : "assistant", content: h.content }));

      addMessage("user", question);
      input.value = "";
      input.style.height = "auto";
      btn.disabled = true;
      statusEl.textContent = "L'assistant réfléchit…";

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            history: apiHistory,
            conversation_id: convBeforeSend.db_id || null,
            user_id: USER_ID
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.erreur || "Erreur serveur");

        if (data.conversation_id) {
          convBeforeSend.db_id = data.conversation_id;
          saveConversations();
        }

        addMessage("bot", data.reponse, data.sources_kb);
        statusEl.textContent = data.outils_appeles && data.outils_appeles.length
          ? "Outils utilisés : " + data.outils_appeles.map(o => o.nom).join(", ")
          : "";
      } catch (err) {
        addMessage("bot", "Erreur : " + err.message, null);
        statusEl.textContent = "";
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("send-btn").addEventListener("click", send);
    questionEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById("mic-btn");

    if (!SpeechRecognition) {
      micBtn.disabled = true;
      micBtn.title = "Non supporté par ce navigateur";
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      micBtn.addEventListener("click", () => {
        recognition.lang = document.getElementById("lang-select").value;
        micBtn.classList.add("recording");
        recognition.start();
      });

      recognition.addEventListener("result", (e) => {
        const transcript = e.results[0][0].transcript;
        questionEl.value = transcript;
        questionEl.dispatchEvent(new Event("input"));
      });

      recognition.addEventListener("end", () => {
        micBtn.classList.remove("recording");
      });

      recognition.addEventListener("error", (e) => {
        micBtn.classList.remove("recording");
        console.error("Erreur reconnaissance vocale :", e.error);
      });
    }
  </script>
</body>
</html>
